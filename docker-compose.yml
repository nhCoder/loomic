services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_BASE_URL: ${NEXT_PUBLIC_SERVER_BASE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      SERVICE_MODE: api
      HOST: 0.0.0.0
      NODE_ENV: production
      LOOMIC_SERVER_PORT: 3001
      LOOMIC_WEB_ORIGIN: ${LOOMIC_WEB_ORIGIN}
      NEXT_PUBLIC_SERVER_BASE_URL: ${NEXT_PUBLIC_SERVER_BASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      LOOMIC_AGENT_BACKEND_MODE: ${LOOMIC_AGENT_BACKEND_MODE:-state}
      LOOMIC_AGENT_MODEL: ${LOOMIC_AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
      GOOGLE_VERTEX_VIDEO_LOCATION: ${GOOGLE_VERTEX_VIDEO_LOCATION:-}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      LOOMIC_SKILLS_ROOT: /opt/loomic/skills
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_VARIANT_STARTER_MONTHLY: ${LEMONSQUEEZY_VARIANT_STARTER_MONTHLY:-}
      LEMONSQUEEZY_VARIANT_STARTER_YEARLY: ${LEMONSQUEEZY_VARIANT_STARTER_YEARLY:-}
      LEMONSQUEEZY_VARIANT_PRO_MONTHLY: ${LEMONSQUEEZY_VARIANT_PRO_MONTHLY:-}
      LEMONSQUEEZY_VARIANT_PRO_YEARLY: ${LEMONSQUEEZY_VARIANT_PRO_YEARLY:-}
      LEMONSQUEEZY_VARIANT_ULTRA_MONTHLY: ${LEMONSQUEEZY_VARIANT_ULTRA_MONTHLY:-}
      LEMONSQUEEZY_VARIANT_ULTRA_YEARLY: ${LEMONSQUEEZY_VARIANT_ULTRA_YEARLY:-}
      LEMONSQUEEZY_VARIANT_BUSINESS_MONTHLY: ${LEMONSQUEEZY_VARIANT_BUSINESS_MONTHLY:-}
      LEMONSQUEEZY_VARIANT_BUSINESS_YEARLY: ${LEMONSQUEEZY_VARIANT_BUSINESS_YEARLY:-}
      VOLCES_API_KEY: ${VOLCES_API_KEY:-}
      VOLCES_BASE_URL: ${VOLCES_BASE_URL:-}
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVICE_MODE: worker
      NODE_ENV: production
      WORKER_ID: ${WORKER_ID:-dokploy-w1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_IMAGE_CONCURRENCY: ${WORKER_IMAGE_CONCURRENCY:-3}
      WORKER_VIDEO_CONCURRENCY: ${WORKER_VIDEO_CONCURRENCY:-2}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      LOOMIC_AGENT_BACKEND_MODE: ${LOOMIC_AGENT_BACKEND_MODE:-state}
      LOOMIC_AGENT_MODEL: ${LOOMIC_AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-}
      GOOGLE_VERTEX_VIDEO_LOCATION: ${GOOGLE_VERTEX_VIDEO_LOCATION:-}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      LOOMIC_SKILLS_ROOT: /opt/loomic/skills
      VOLCES_API_KEY: ${VOLCES_API_KEY:-}
      VOLCES_BASE_URL: ${VOLCES_BASE_URL:-}
    restart: unless-stopped
